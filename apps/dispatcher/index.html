<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой Автомеханик — панель диспетчера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --ink-soft:#4D5769;
    --ink-faint:#8891A0;
    --paper:#F6F4EF;
    --paper-dim:#ECE8DE;
    --card:#FFFFFF;
    --amber:#E8A33D;
    --amber-dark:#C77F1D;
    --amber-soft:#FBF0DC;
    --copper:#B5602C;
    --teal:#3F7D6B;
    --teal-soft:#E3EEE9;
    --alert:#C1503F;
    --alert-soft:#F6E4E0;
    --line:#DEDACE;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  .app{ display:flex; min-height:100vh; }

  /* ---------------- SIDEBAR ---------------- */
  .sidebar{
    width:248px; flex:none;
    background:var(--ink); color:#fff;
    display:flex; flex-direction:column;
    padding:24px 18px;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .brand .mark{
    width:32px; height:32px; border-radius:9px; background:var(--amber);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .brand .mark svg{ width:18px; height:18px; }
  .brand .txt .n{ font-family:'Space Grotesk',sans-serif; font-size:14.5px; font-weight:700; line-height:1.2; }
  .brand .txt .s{ font-size:10.5px; color:rgba(255,255,255,.45); letter-spacing:.04em; text-transform:uppercase; margin-top:1px; }

  .nav{ margin-top:34px; display:flex; flex-direction:column; gap:3px; }
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:10px;
    color:rgba(255,255,255,.6); cursor:pointer; font-size:14px; font-weight:500; position:relative;
  }
  .nav-item svg{ width:18px; height:18px; flex:none; }
  .nav-item:hover{ background:rgba(255,255,255,.05); color:#fff; }
  .nav-item.active{ background:rgba(255,255,255,.1); color:#fff; }
  .nav-item .count{
    margin-left:auto; background:var(--amber); color:#2B1A03; font-size:11px; font-weight:700;
    padding:1px 7px; border-radius:20px; font-family:'IBM Plex Mono',monospace;
  }

  .sidebar-footer{ margin-top:auto; padding-top:18px; border-top:1px solid rgba(255,255,255,.1); }
  .sto-mini{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .sto-mini .av{
    width:36px; height:36px; border-radius:50%; background:var(--teal); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; flex:none;
  }
  .sto-mini .name{ font-size:13px; font-weight:600; }
  .sto-mini .rating{ font-size:11px; color:rgba(255,255,255,.5); margin-top:1px; }

  /* ---------------- CONTENT ---------------- */
  .content{ flex:1; padding:36px 44px 60px; max-width:1180px; }
  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:14px; }
  .topbar h1{ font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:600; letter-spacing:-.01em; }
  .topbar p.sub{ color:var(--ink-soft); font-size:13.5px; margin-top:4px; }

  .filter-row{ display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
  .filter-chip{
    padding:8px 14px; border-radius:20px; border:1.5px solid var(--line); background:var(--card);
    font-size:12.5px; color:var(--ink-soft); cursor:pointer;
  }
  .filter-chip.selected{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:16px; }

  /* ---------------- REQUEST CARD ---------------- */
  .req-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px;
    cursor:pointer; transition:.15s;
  }
  .req-card:hover{ border-color:var(--ink-soft); }
  .req-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .req-top .car{ font-family:'Space Grotesk',sans-serif; font-size:15.5px; font-weight:600; }
  .badge{
    font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; letter-spacing:.03em; flex:none;
    text-transform:uppercase; font-family:'IBM Plex Mono',monospace;
  }
  .badge.urgent{ background:var(--alert-soft); color:var(--alert); }
  .badge.new{ background:var(--amber-soft); color:var(--amber-dark); }

  .req-symptom{ font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin-top:8px; }
  .tag-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .tag-mini{ font-size:11px; background:var(--paper-dim); color:var(--ink-soft); padding:3px 9px; border-radius:14px; }

  .req-meta{ display:flex; gap:14px; margin-top:14px; flex-wrap:wrap; }
  .req-meta .m{ font-size:11.5px; color:var(--ink-faint); display:flex; align-items:center; gap:5px; }
  .req-meta svg{ width:13px; height:13px; }

  .req-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .req-price{ font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; color:var(--ink); }
  .req-price span{ font-size:10.5px; color:var(--ink-faint); font-weight:400; display:block; font-family:'Inter',sans-serif; }

  .btn{
    border:1px solid transparent; border-radius:999px; padding:10px 18px; font-family:'Inter',sans-serif;
    font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; line-height:1.2;
    transition:background .15s, border-color .15s;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:#F7DDB0; color:#6B4510; }
  .btn-primary:hover{ background:#F2CF92; }
  .btn-dark{ background:#3B4656; color:#fff; }
  .btn-dark:hover{ background:#4A5668; }
  .btn-outline{ background:var(--card); color:var(--ink-soft); border-color:#E7E3D9; }
  .btn-outline:hover{ background:var(--paper); border-color:var(--line); }
  .btn-teal{ background:var(--teal-soft); color:var(--teal); }
  .btn-teal:hover{ background:#D3E6DE; }
  .btn-block{ width:100%; }

  .req-detail{
    margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);
    display:none; font-size:13px; color:var(--ink-soft); line-height:1.6;
  }
  .req-detail.open{ display:block; }
  .req-detail .locked{ color:var(--ink-faint); font-style:italic; }
  .req-detail .row{ display:flex; justify-content:space-between; margin-top:6px; }
  .req-detail .row b{ color:var(--ink); font-weight:600; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-faint);
  }
  .empty-state svg{ width:36px; height:36px; margin-bottom:10px; opacity:.5; }
  .empty-state p{ font-size:14px; }

  /* ---------------- MY JOBS LIST ---------------- */
  .job-row{
    display:flex; align-items:center; gap:16px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:15px 18px; margin-bottom:10px; cursor:pointer;
  }
  .job-row:hover{ border-color:var(--ink-soft); }
  .job-row .car{ font-family:'Space Grotesk',sans-serif; font-size:14.5px; font-weight:600; width:170px; flex:none; }
  .job-row .desc{ flex:1; font-size:13px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .status-pill{
    font-size:11px; font-weight:600; padding:5px 11px; border-radius:20px; flex:none;
    font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.02em;
  }
  .status-pill.s0{ background:var(--amber-soft); color:var(--amber-dark); }
  .status-pill.s1{ background:#E9E4F5; color:#6A4FA0; }
  .status-pill.s2{ background:var(--alert-soft); color:var(--alert); }
  .status-pill.s3{ background:#DDEAF6; color:#2C6FA3; }
  .status-pill.s4{ background:var(--teal-soft); color:var(--teal); }

  /* ---------------- JOB DETAIL ---------------- */
  .backlink{ display:flex; align-items:center; gap:8px; color:var(--ink-soft); font-size:13.5px; cursor:pointer; margin-bottom:18px; }
  .backlink svg{ width:16px; height:16px; }

  .detail-grid{ display:grid; grid-template-columns:1fr 300px; gap:24px; align-items:start; }
  @media (max-width:900px){ .detail-grid{ grid-template-columns:1fr; } }

  .panel{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:16px; }
  .panel h4{ font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; margin-bottom:12px; }

  .stage-track{ display:flex; justify-content:space-between; margin:8px 0 26px; position:relative; }
  .stage-track::before{ content:""; position:absolute; top:9px; left:16px; right:16px; height:2px; background:var(--line); z-index:0; }
  .stage-dot-wrap{ display:flex; flex-direction:column; align-items:center; gap:6px; z-index:1; width:70px; }
  .stage-dot{ width:20px; height:20px; border-radius:50%; background:var(--card); border:2px solid var(--line); }
  .stage-dot-wrap.done .stage-dot{ background:var(--teal); border-color:var(--teal); }
  .stage-dot-wrap.current .stage-dot{ background:var(--amber); border-color:var(--amber-dark); box-shadow:0 0 0 4px rgba(232,163,61,.25); }
  .stage-dot-wrap span.lbl{ font-size:10.5px; text-align:center; color:var(--ink-faint); line-height:1.2; }
  .stage-dot-wrap.current span.lbl{ color:var(--ink); font-weight:600; }

  .client-row{ display:flex; gap:12px; align-items:center; margin-bottom:14px; }
  .client-row .av{ width:42px; height:42px; border-radius:50%; background:var(--teal-soft); color:var(--teal); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; flex:none; }
  .client-row .name{ font-size:14px; font-weight:600; }
  .client-row .phone{ font-size:12.5px; color:var(--ink-faint); margin-top:2px; font-family:'IBM Plex Mono',monospace; }

  .kv{ font-size:13px; color:var(--ink-soft); padding:7px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; }
  .kv:last-child{ border-bottom:none; }
  .kv b{ color:var(--ink); font-weight:600; text-align:right; }

  .line-item{ display:flex; gap:8px; margin-bottom:8px; }
  .line-item input{ border:1.5px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13px; font-family:'Inter',sans-serif; }
  .line-item .li-name{ flex:1; }
  .line-item .li-price{ width:100px; font-family:'IBM Plex Mono',monospace; }
  .add-line{ font-size:12.5px; color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; gap:5px; margin-bottom:14px; }
  .add-line svg{ width:14px; height:14px; }

  .cost-total{ display:flex; justify-content:space-between; padding-top:12px; margin-top:6px; border-top:1.5px solid var(--ink); }
  .cost-total span{ font-weight:700; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:16px; }

  textarea.note{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px; font-family:'Inter',sans-serif;
    font-size:13px; min-height:70px; resize:none; margin-bottom:14px;
  }
  .progress-bar{ height:8px; border-radius:5px; background:var(--paper-dim); overflow:hidden; margin:12px 0; }
  .progress-bar i{ display:block; height:100%; background:linear-gradient(90deg,var(--amber),var(--copper)); border-radius:5px; }

  .waiting-note{ display:flex; gap:10px; align-items:center; background:var(--amber-soft); border:1px solid #F0DBAE; border-radius:12px; padding:12px 14px; font-size:12.5px; color:#5C4419; margin-top:10px; }
  .waiting-note svg{ width:16px; height:16px; flex:none; }

  /* ---------------- HISTORY ---------------- */
  .hist-row{ display:flex; align-items:center; gap:16px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px 18px; margin-bottom:10px; }
  .hist-row .car{ font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; width:170px; flex:none; }
  .hist-row .date{ font-size:12px; color:var(--ink-faint); width:110px; flex:none; font-family:'IBM Plex Mono',monospace; }
  .stars{ color:var(--amber-dark); font-size:13px; letter-spacing:1px; flex:1; }
  .hist-row .payout{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; }

  /* ---------------- PROFILE ---------------- */
  .profile-card{ background:var(--ink); color:#fff; border-radius:18px; padding:28px; margin-bottom:20px; }
  .profile-card .n{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600; }
  .profile-card .a{ font-size:13px; color:rgba(255,255,255,.55); margin-top:4px; }
  .profile-card .stat-row{ display:flex; gap:30px; margin-top:20px; }
  .profile-card .stat .v{ font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; }
  .profile-card .stat .k{ font-size:11px; color:rgba(255,255,255,.5); margin-top:2px; }

  .toast{
    position:fixed; right:32px; bottom:32px;
    background:var(--ink); color:#fff; padding:14px 18px; border-radius:14px;
    font-size:13.5px; display:flex; gap:10px; align-items:center;
    opacity:0; transform:translateY(10px); transition:.25s; pointer-events:none; z-index:100;
  }
  .toast.show{ opacity:1; transform:translateY(0); }


  /* ================= ДИСПЕТЧЕР ================= */
  .sidebar .brand .mark{ background:var(--alert); }
  .role-switch{ display:flex; background:rgba(255,255,255,.08); border-radius:10px; padding:3px; margin-top:22px; }
  .role-switch div{ flex:1; text-align:center; font-size:12px; font-weight:600; padding:7px 4px; border-radius:8px; cursor:pointer; color:rgba(255,255,255,.55); }
  .role-switch div.on{ background:#fff; color:var(--ink); }
  .nav-item .count.red{ background:var(--alert); color:#fff; }
  .shift-box{ font-size:11.5px; color:rgba(255,255,255,.55); line-height:1.5; }
  .shift-box b{ color:#fff; font-weight:600; }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .kpi .k{ font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.04em; }
  .kpi .v{ font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:600; margin-top:4px; }
  .kpi .v.red{ color:var(--alert); }
  .kpi .s{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
  @media (max-width:1000px){ .two-col{ grid-template-columns:1fr; } .kpi-row{ grid-template-columns:1fr 1fr; } }

  .ev{ display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .ev:last-child{ border-bottom:none; }
  .ev:hover .t1{ text-decoration:underline; }
  .ev-ico{ width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
  .ev-ico svg{ width:16px; height:16px; }
  .ev-ico.sos{ background:var(--alert); color:#fff; }
  .ev-ico.dispute{ background:var(--alert-soft); color:var(--alert); }
  .ev-ico.late{ background:var(--amber-soft); color:var(--amber-dark); }
  .ev-ico.stuck{ background:#E5ECF6; color:#2C6FA3; }
  .ev-ico.ok{ background:var(--teal-soft); color:var(--teal); }
  .ev .body{ flex:1; }
  .ev .t1{ font-size:13.5px; font-weight:600; }
  .ev .t2{ font-size:12px; color:var(--ink-soft); margin-top:2px; line-height:1.45; }
  .ev .tm{ font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; flex:none; }

  .timer{ display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; }
  .timer.ok{ background:var(--teal-soft); color:var(--teal); }
  .timer.warn{ background:var(--amber-soft); color:var(--amber-dark); }
  .timer.bad{ background:var(--alert-soft); color:var(--alert); }
  .timer.done{ background:var(--paper-dim); color:var(--ink-faint); }

  table.tbl{ width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .tbl th{ text-align:left; font-size:10.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); background:var(--paper-dim); padding:9px 14px; }
  .tbl td{ padding:12px 14px; border-top:1px solid var(--line); font-size:13px; vertical-align:middle; }
  .tbl tr.click{ cursor:pointer; }
  .tbl tr.click:hover td{ background:var(--paper); }
  .tbl tr.hl td{ background:#FFF8EE; }
  .tbl .mono{ font-family:'IBM Plex Mono',monospace; }
  .tbl .sub{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .tbl .nw, .tbl th{ white-space:nowrap; }
  .who{ display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .pill{ font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:20px; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; white-space:nowrap; display:inline-block; }
  .pill.free{ background:var(--teal-soft); color:var(--teal); }
  .pill.road{ background:#E5ECF6; color:#2C6FA3; }
  .pill.job{ background:var(--amber-soft); color:var(--amber-dark); }
  .pill.off{ background:var(--paper-dim); color:var(--ink-faint); }
  .pill.late{ background:var(--alert-soft); color:var(--alert); }
  .pill.open{ background:var(--alert-soft); color:var(--alert); }
  .pill.waiting{ background:#E5ECF6; color:#2C6FA3; }
  .pill.approval{ background:#EEE8F6; color:#6A4FA0; }
  .pill.closed{ background:var(--teal-soft); color:var(--teal); }

  .steps-track{ display:flex; gap:4px; margin:10px 0 4px; }
  .steps-track div{ flex:1; height:6px; border-radius:3px; background:var(--line); }
  .steps-track div.done{ background:var(--teal); }
  .steps-track div.cur{ background:var(--amber); }
  .steps-lbl{ display:flex; justify-content:space-between; gap:10px; font-size:10px; color:var(--ink-faint); white-space:nowrap; }
  .steps-cell{ min-width:220px; }
  .order-cell{ min-width:190px; }

  .sos-card{ background:var(--card); border:2px solid var(--alert); border-radius:16px; padding:20px; margin-bottom:16px; }
  .sos-card.closed{ border-color:var(--line); opacity:.75; }
  .sos-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .sos-top .n{ font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:600; }
  .sos-elapsed{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; color:var(--alert); }
  .sos-elapsed.ok{ color:var(--teal); font-size:18px; }
  .sos-steps{ display:flex; gap:8px; margin:14px 0; flex-wrap:wrap; }
  .sos-steps span{ font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:20px; background:var(--paper-dim); color:var(--ink-faint); }
  .sos-steps span.done{ background:var(--teal-soft); color:var(--teal); }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .btn-red{ background:var(--alert-soft); color:var(--alert); }
  .btn-red:hover{ background:#F0D3CC; }
  .btn-sm{ padding:7px 14px; font-size:12.5px; border-radius:999px; }
  .cell-actions{ display:flex; gap:8px; justify-content:flex-end; align-items:center; flex-wrap:nowrap; }

  .freeze{ display:flex; gap:10px; align-items:center; background:var(--alert-soft); border:1px solid #EBC9C1; color:var(--alert); border-radius:12px; padding:11px 14px; font-size:13px; font-weight:600; margin-bottom:16px; }
  .freeze svg{ width:17px; height:17px; flex:none; }
  .freeze.ok{ background:var(--teal-soft); border-color:#C9DED6; color:var(--teal); }
  .tabs{ display:flex; gap:6px; margin-bottom:12px; border-bottom:1px solid var(--line); }
  .tabs div{ padding:9px 12px; font-size:13px; font-weight:600; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs div.on{ color:var(--ink); border-color:var(--amber); }
  .cmp{ display:grid; grid-template-columns:1fr 1fr; gap:8px; max-width:520px; }
  .ph{ aspect-ratio:4/3; border-radius:8px; background:linear-gradient(135deg,#E5E1D6,#CFC9BA); position:relative; display:flex; align-items:center; justify-content:center; }
  .ph svg{ width:20px; height:20px; color:rgba(27,36,48,.28); }

function events(){
  const ev = [];
  sosCalls.filter(s=>s.step<4).forEach(s=>ev.push({k:'sos', p:0, t1:`SOS · ${s.scenario} · ${s.client}`, t2:`${s.car} · ${s.place}`, tm:fmtDur(since(s.ago)), go:"showView('sos')"}));
  disputes.filter(d=>d.status==='open').forEach(d=>ev.push({k:'dispute', p:1, t1:`Спор ${d.id} · ${d.type}`, t2:`${d.client} · заказ №${d.order} · ${d.claim}`, tm:d.takenAt===null?`ждёт ${fmtDur(since(d.ago))}`:'в работе', go:`openDispute('${d.id}')`}));
  concierges.filter(c=>c.status==='late').forEach(c=>ev.push({k:'late', p:2, t1:`Консьерж ${c.name} опаздывает на ${c.lateMin} мин`, t2:`Заказ №${c.order} · ${c.note}. Больше 20 мин — штраф 50% выезда начислен автоматически`, tm:'сейчас', go:"showView('concierges')"}));
  unassigned.forEach(u=>ev.push({k:'late', p:2, t1:`Заказ №${u.id} ждёт консьержа`, t2:`${u.car} · ${u.address} · ${u.slot}`, tm:'до слота 1 ч 20 мин', go:"showView('concierges')"}));
  orders.filter(o=>o.stuck && !o.stuck.startsWith('Опоздание')).forEach(o=>ev.push({k:'stuck', p:3, t1:`Заказ №${o.id} завис: ${o.stuck.toLowerCase()}`, t2:`${o.car} · ${o.client} · ${o.sto}`, tm:o.inStage, go:"showView('orders')"}));
  disputes.filter(d=>d.status==='approval').forEach(d=>ev.push({k:'ok', p:4, t1:`Спор ${d.id} ждёт директора`, t2:`${DECISIONS[d.proposal.decision]} ${money(d.proposal.amount)}`, tm:'', go:`openDispute('${d.id}')`}));
  return ev.sort((a,b)=>a.p-b.p);
}
function renderOverview(){
  const ev = events();
  const onLine = concierges.filter(c=>c.status!=='off').length;
  const openD = disputes.filter(d=>d.status!=='closed');
  const activeSos = sosCalls.filter(s=>s.step<4).length;
  document.getElementById('view-overview').innerHTML = `
    <div class="topbar"><div><h1>Сводка</h1><p class="sub">Минск · всё, что требует внимания диспетчера прямо сейчас</p></div></div>
    <div class="kpi-row">
      <div class="kpi"><div class="k">SOS в работе</div><div class="v ${activeSos?'red':''}">${activeSos}</div><div class="s">цель — принять за 2 мин</div></div>
      <div class="kpi"><div class="k">Открытые споры</div><div class="v">${openD.length}</div><div class="s">${openD.filter(d=>d.status==='approval').length} у директора</div></div>
      <div class="kpi"><div class="k">Консьержи на линии</div><div class="v">${onLine} / ${concierges.length}</div><div class="s">${concierges.filter(c=>c.status==='free').length} свободны</div></div>
      <div class="kpi"><div class="k">Активные заказы</div><div class="v">${orders.length}</div><div class="s">${orders.filter(o=>o.stuck).length} зависли</div></div>
    </div>
    <div class="two-col">
      <div class="panel"><h4>Лента событий</h4>${ev.map(e=>`
        <div class="ev" onclick="${e.go}">
          <div class="ev-ico ${e.k}">${I[e.k]}</div>
          <div class="body"><div class="t1">${e.t1}</div><div class="t2">${e.t2}</div></div>
          <div class="tm">${e.tm}</div>
        </div>`).join('') || '<p class="warn-note">Всё спокойно</p>'}</div>
      <div>
        <div class="panel"><h4>Сроки по спорам</h4>
          ${openD.map(d=>`<div class="kv" style="cursor:pointer; align-items:center;" onclick="openDispute('${d.id}')"><span><b style="color:var(--ink);">${d.id}</b> · ${d.type}</span><span style="display:flex; gap:6px;">${d.takenAt===null?reactTimer(d):''}${decideTimer(d)}</span></div>`).join('')}
        </div>
        <div class="panel"><h4>Правила смены</h4>
          <div class="kv"><span>Реакция на спор</span><b>15 мин, круглосуточно</b></div>
          <div class="kv"><span>Решение спора</span><b>до 3 суток</b></div>
          <div class="kv"><span>Возвраты</span><b>только через директора</b></div>
          <div class="kv"><span>Кто платит возврат</span><b>СТО (ущерб консьержа — страховая)</b></div>
          <div class="kv"><span>Опоздание консьержа > 20 мин</span><b>штраф 50% выезда</b></div>
        </div>
      </div>
    </div>`;
}

/* ---------------- SOS ---------------- */
function renderSos(){
  const list = [...sosCalls].sort((a,b)=>(a.step===4)-(b.step===4));
  document.getElementById('view-sos').innerHTML = `
    <div class="topbar"><div><h1>SOS</h1><p class="sub">Круглосуточно. Новые вызовы — со звуком и всегда сверху</p></div></div>
    ${list.map(s=>{
      const el = since(s.ago);
      const closed = s.step===4;
      const actions = [
        ['Принять вызов', `sosStep('${s.id}',1)`],
        ['Партнёр вызван', `sosStep('${s.id}',2)`],
        ['Помощь прибыла', `sosStep('${s.id}',3)`],
        ['Закрыть вызов', `sosStep('${s.id}',4)`]
      ][s.step];
      return `<div class="sos-card ${closed?'closed':''}">
        <div class="sos-top">
          <div><div class="n">${s.id} · ${s.scenario}</div><div class="sub" style="font-size:13px; color:var(--ink-soft); margin-top:3px;">${s.client} · ${s.phone} · пакет «${s.plan}»</div></div>
          <div style="text-align:right;">
            ${closed ? `<div class="sos-elapsed ok">закрыт</div><div class="warn-note">реакция ${s.reaction} сек</div>`
              : s.step===0 ? `<div class="sos-elapsed">${fmtDur(el)}</div><div class="warn-note">${el>SOS_TARGET?'дольше цели 2 мин!':'ждёт принятия'}</div>`
              : `<div class="sos-elapsed ok">${fmtDur(el)}</div><div class="warn-note">в работе</div>`}
          </div>
        </div>
        <div class="sos-steps">${SOS_STEPS.map((st,i)=>`<span class="${i<=s.step?'done':''}">${st}</span>`).join('')}</div>
        <div class="kv"><span>Машина</span><b>${s.car}</b></div>
        <div class="kv"><span>Где</span><b>${s.place}</b></div>
        ${s.log.length?`<div style="margin-top:10px;">${s.log.map(l=>`<div class="log-line"><span class="tm">${l.t}</span>${l.x}</div>`).join('')}</div>`:''}
        ${closed?'':`<div class="btn-row" style="margin-top:14px;">
          <button class="btn ${s.step===0?'btn-red':'btn-primary'}" onclick="${actions[1]}">${actions[0]}</button>
          <button class="btn btn-outline" onclick="showToast('Открыт чат с ${s.client}')">Написать в чат</button>
          ${s.step>=1&&s.step<2?`<button class="btn btn-outline" onclick="sosStep('${s.id}',2,'эвакуатор')">Вызвать эвакуатор</button>`:''}
        </div>`}
      </div>`;}).join('')}`;
}
function sosStep(id, step, what){
  const s = sosCalls.find(x=>x.id===id);
  if(step===1) s.reaction = since(s.ago);
  s.step = step;
  const txt = {1:`Вызов принят диспетчером Ольгой${s.reaction?` за ${s.reaction} сек`:''}`, 2:`Вызван партнёр: ${what||'техпомощь'}, прибытие ~25 мин`, 3:'Помощь на месте', 4:'Вызов закрыт, запись в истории клиентки'}[step];
  s.log.push({t:nowStr(), x:txt});
  showToast(txt);
  render();
}

/* ---------------- СПОРЫ ---------------- */
function renderDisputes(){
  const list = [...disputes].sort((a,b)=>(a.status==='closed')-(b.status==='closed'));
  document.getElementById('view-disputes').innerHTML = `
    <div class="topbar"><div><h1>Споры</h1><p class="sub">Реакция — 15 минут, решение — до 3 суток. Пока спор открыт, оплата заказа заморожена</p></div></div>
    <table class="tbl"><thead><tr><th>Спор</th><th>Тип</th><th>Стороны</th><th>Сумма</th><th>Статус</th><th>Сроки</th></tr></thead><tbody>
    ${list.map(d=>`<tr class="click ${d.status==='open'&&d.takenAt===null?'hl':''}" onclick="openDispute('${d.id}')">
      <td><b>${d.id}</b><div class="sub">заказ №${d.order}</div></td>
      <td>${d.type}<div class="sub">${d.source}</div></td>
      <td>${d.client}<div class="sub">${d.sto}</div></td>
      <td class="mono">${d.amount?money(d.amount):'—'}</td>
      <td><span class="pill ${d.status}">${STATUS_LBL[d.status]}</span></td>
      <td style="white-space:nowrap;">${d.status==='open'&&d.takenAt===null?reactTimer(d)+'<br>':''}${decideTimer(d)}</td>
    </tr>`).join('')}</tbody></table>`;
}
function openDispute(id){ openDisputeId = id; disputeTab = 'facts'; showView('dispute'); }

function factsHtml(d){
  if(d.facts==='acts'){
    const pairs = [['Спереди','14:32','19:24'],['Справа','14:32','19:24'],['Бампер справа крупно','—','19:24']];
    return `<div class="cmp" style="margin-bottom:6px; font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace;"><span>АКТ №1 · ЗАБОР</span><span>АКТ №4 · ВОЗВРАТ</span></div>
      ${pairs.map(p=>`<div class="cmp" style="margin-bottom:8px;">
        <div class="ph">${p[1]==='—'?'<span class="warn-note">нет снимка</span>':I.cam}<div class="cap">${p[0]} · ${p[1]}</div></div>
        <div class="ph" style="${p[0].includes('крупно')||p[0]==='Справа'?'outline:2px solid var(--alert); outline-offset:-2px;':''}">${I.cam}<div class="cap">${p[0]} · ${p[2]}</div></div></div>`).join('')}
      <div class="kv"><span>Повреждения в акте №1</span><b>Царапина на заднем бампере слева</b></div>
      <div class="kv"><span>Повреждения в акте №4</span><b style="color:var(--alert);">+ Царапина на переднем бампере справа</b></div>
      <div class="kv"><span>Акты №2 и №3 (СТО)</span><b>Новой царапины нет — появилась после выдачи консьержу</b></div>
      <div class="kv"><span>Кто вёз машину</span><b>Консьерж ${d.concierge}</b></div>`;
  }
  if(d.facts==='estimate'){
    return `<h4 style="font-size:13.5px;">Смета и чек по заказу №${d.order}</h4>
      ${d.estimate.map(e=>`<div class="kv"><span>${e[0]}</span><b>${money(e[1])}</b></div>`).join('')}
      <div class="kv"><span>Итого оплачено</span><b>${money(d.orderSum)}</b></div>`;
  }
  return `<p class="warn-note">${d.result||''}</p>`;
}

function renderDispute(){
  const d = disputes.find(x=>x.id===openDisputeId);
  const frozen = d.status!=='closed';
  const tabs = {facts:'Факты', chat:'Чат', log:'История'};
  let body = '';
  if(disputeTab==='facts') body = factsHtml(d);
  if(disputeTab==='chat') body = (d.chat.map(c=>`<div class="chat-line"><b>${c.w}</b><span class="tm">${c.t}</span><br>${c.x}</div>`).join('') || '<p class="warn-note">Сообщений нет</p>')
     + (frozen && role==='dispatcher' ? `<div style="display:flex; gap:8px; margin-top:10px;"><input class="inp" id="chatInp" placeholder="Сообщение сторонам спора"><button class="btn btn-dark btn-sm" onclick="sendChat()">Отправить</button></div>` : '');
  if(disputeTab==='log') body = d.log.map(l=>`<div class="log-line"><span class="tm">${l.t}</span>${l.x}</div>`).join('');

  document.getElementById('view-dispute').innerHTML = `
    <div class="backlink" onclick="showView('disputes')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Все споры</div>
    <div class="topbar">
      <div><h1>Спор ${d.id} · ${d.type}</h1><p class="sub">Заказ №${d.order} · ${d.car} · ${d.source}</p></div>
      <div style="display:flex; gap:8px; align-items:center;">${d.status==='open'&&d.takenAt===null?reactTimer(d):''}${decideTimer(d)}<span class="pill ${d.status}">${STATUS_LBL[d.status]}</span></div>
    </div>
    <div class="freeze ${frozen?'':'ok'}">${frozen?I.lock:I.ok}${frozen?`Оплата по заказу ${money(d.orderSum)} заморожена до решения`:`Спор закрыт · оплата разблокирована`}</div>
    <div class="detail-grid">
      <div>
        <div class="panel"><h4>Претензия</h4><p style="font-size:14px; line-height:1.55;">«${d.claim}»</p><p class="warn-note" style="margin-top:6px;">${d.client} · сумма под вопросом: ${d.amount?money(d.amount):'—'}</p></div>
        <div class="panel">
          <div class="tabs">${Object.keys(tabs).map(k=>`<div class="${disputeTab===k?'on':''}" onclick="disputeTab='${k}'; renderDispute();">${tabs[k]}</div>`).join('')}</div>
          ${body}
        </div>
        ${actionPanel(d)}
      </div>
      <div>
        <div class="panel"><h4>Стороны</h4>
          <div class="kv"><span>Клиентка</span><b>${d.client}</b></div>
          <div class="kv"><span>СТО</span><b>${d.sto}</b></div>
          <div class="kv"><span>Консьерж</span><b>${d.concierge}</b></div>
        </div>
        <div class="panel"><h4>Правила</h4>
          <p class="warn-note">Возврат клиентке удерживается из выплаты СТО и утверждается директором. Ущерб от консьержа при перегоне — страховой случай, СТО не платит. Решение после закрытия не меняется — только повторный спор с новыми фактами.</p>
        </div>
      </div>
    </div>`;
  if(document.getElementById('decSel')) decChanged();
}

function actionPanel(d){
  if(d.status==='closed') return `<div class="panel"><h4>Решение</h4><p style="font-size:13.5px; line-height:1.55;">${d.result}</p></div>`;
  if(d.status==='approval'){
    const p = d.proposal;
    return `<div class="panel"><h4>На утверждении у директора</h4>
      <div class="kv"><span>Предложение</span><b>${DECISIONS[p.decision]} · ${money(p.amount)}</b></div>
      <div class="kv"><span>Обоснование</span><b style="max-width:60%;">${p.reason}</b></div>
      <div class="kv"><span>Подготовила</span><b>${p.by}</b></div>
      ${moneyCalc(d, p.amount)}
      ${role==='director' ? directorButtons(d) : '<p class="warn-note">Директору отправлен push. Диспетчер не может вернуть деньги сам.</p>'}
    </div>`;
  }
  if(role==='director') return '';
  if(d.takenAt===null) return `<div class="panel"><h4>Новый спор</h4><p class="warn-note" style="margin-bottom:12px;">Возьмите спор в работу в течение 15 минут — стороны получат push, что спор рассматривается.</p><button class="btn btn-primary btn-block" onclick="takeDispute()">Взять в работу</button></div>`;
  return `<div class="panel"><h4>Действия диспетчера</h4>
    <div class="btn-row" style="margin-bottom:16px;">
      <button class="btn btn-outline btn-sm" onclick="requestInfo('клиентки','фото и пояснение')">Запросить фото у клиентки</button>
      <button class="btn btn-outline btn-sm" onclick="requestInfo('СТО','объяснение')">Запросить объяснение у СТО</button>
      <button class="btn btn-outline btn-sm" onclick="requestInfo('консьержа','объяснение')">Запросить объяснение у консьержа</button>
    </div>
    ${d.waitingFor?`<p class="warn-note" style="margin:-6px 0 14px;">Ждём ответ: ${d.waitingFor}</p>`:''}
    <h4 style="font-size:14px;">Предложение по спору</h4>
    <div class="form-grid">
      <div><label>Решение</label><select class="inp" id="decSel" onchange="decChanged()">
        ${Object.keys(DECISIONS).map(k=>`<option value="${k}" ${d.facts==='acts'&&k==='insurance'?'selected':''}>${DECISIONS[k]}</option>`).join('')}
      </select></div>
      <div><label>Сумма возврата</label><input class="inp" id="decAmount" type="number" value="${d.amount}" oninput="decChanged()"></div>
    </div>
    <label class="lbl">Обоснование</label>
    <textarea class="note" id="decReason" placeholder="Почему такое решение: ссылки на акты, смету, чат"></textarea>
    <div id="decCalc"></div>
    <button class="btn btn-dark btn-block" onclick="submitProposal()" id="decBtn">Отправить</button>
  </div>`;
}

function moneyCalc(d, refund){
  const base = d.orderSum - refund;
  const fee = base*COMMISSION;
  return `<div class="money">
    <div class="kv"><span>Оплачено клиенткой</span><b>${money(d.orderSum)}</b></div>
    <div class="kv"><span>Возврат клиентке (из выплаты СТО)</span><b style="color:var(--alert);">− ${money(refund)}</b></div>
    <div class="kv"><span>Удержание платформы 5% от ${money(base)}</span><b>${money(fee)}</b></div>
    <div class="kv"><span>Выплата СТО</span><b>${money(base-fee)}</b></div>
  </div>`;
}

function decChanged(){
  const d = disputes.find(x=>x.id===openDisputeId);
  const k = document.getElementById('decSel').value;
  const amt = document.getElementById('decAmount');
  const isRefund = k==='partial'||k==='full';
  if(k==='full') amt.value = d.orderSum;
  amt.disabled = !isRefund;
  document.getElementById('decCalc').innerHTML = isRefund ? moneyCalc(d, +amt.value||0)
    : k==='insurance' ? `<p class="warn-note" style="margin-bottom:10px;">Ущерб от консьержа покрывает страховка. СТО получит полную выплату. Клиентке — компенсация через страховой случай.</p>`
    : `<p class="warn-note" style="margin-bottom:10px;">Без возврата денег — диспетчер закрывает спор сам.</p>`;
  document.getElementById('decBtn').textContent = isRefund ? 'Отправить директору на утверждение' : 'Закрыть спор';
}

function takeDispute(){
  const d = disputes.find(x=>x.id===openDisputeId);
  d.takenAt = since(d.ago);
  d.status = 'open';
  d.log.push({t:nowStr(), x:`Диспетчер Ольга взяла спор в работу (через ${fmtDur(d.takenAt)})`});
  showToast('Спор в работе — стороны получили push');
  renderDispute(); setTimeout(decChanged,0); updateCounts();
}
function requestInfo(who, what){
  const d = disputes.find(x=>x.id===openDisputeId);
  d.status = 'waiting'; d.waitingFor = who;
  d.log.push({t:nowStr(), x:`Запрошено: ${what} у ${who}`});
  showToast(`Запрос отправлен ${who} — push в приложение`);
  renderDispute(); setTimeout(decChanged,0);
}
function sendChat(){
  const d = disputes.find(x=>x.id===openDisputeId);
  const v = document.getElementById('chatInp').value.trim(); if(!v) return;
  d.chat.push({w:'Диспетчер', t:nowStr(), x:v}); renderDispute();
}
function submitProposal(){
  const d = disputes.find(x=>x.id===openDisputeId);
  const k = document.getElementById('decSel').value;
  const amount = +document.getElementById('decAmount').value || 0;
  const reason = document.getElementById('decReason').value.trim();
  if(!reason){ showToast('Добавьте обоснование решения'); return; }
  if(k==='partial'||k==='full'){
    d.status='approval'; d.proposal={decision:k, amount, reason, by:'Ольга К.'};
    d.log.push({t:nowStr(), x:`Предложен ${DECISIONS[k].toLowerCase()} ${money(amount)} → директору на утверждение`});
    showToast('Отправлено директору — ему пришёл push');
  } else {
    d.status='closed';
    d.result = k==='insurance' ? `Страховой случай: ущерб от консьержа ${d.concierge} передан в страховую. СТО получает полную выплату. ${reason}` : `${DECISIONS[k]}. ${reason}`;
    d.log.push({t:nowStr(), x:`Спор закрыт: ${DECISIONS[k].toLowerCase()}. Оплата разблокирована`});
    const o = orders.find(x=>x.id===d.order); if(o) o.frozen=false;
    showToast('Спор закрыт — стороны получили push');
  }
  renderDispute();
}

/* ---------------- ДИРЕКТОР ---------------- */
function directorButtons(d){
  return `<label class="lbl" style="margin-top:10px;">Комментарий директора</label>
    <textarea class="note" id="dirComment-${d.id}" placeholder="Необязательно при утверждении, обязательно при возврате на доработку"></textarea>
    <div class="btn-row"><button class="btn btn-teal" onclick="approve('${d.id}')">Утвердить возврат</button><button class="btn btn-outline" onclick="reject('${d.id}')">Вернуть диспетчеру</button></div>`;
}
function renderApprovals(){
  const list = disputes.filter(d=>d.status==='approval');
  document.getElementById('view-approvals').innerHTML = `
    <div class="topbar"><div><h1>Возвраты на утверждение</h1><p class="sub">Все возвраты клиенткам проходят через директора. Возврат удерживается из выплаты СТО</p></div></div>
    ${list.length ? list.map(d=>`<div class="panel">
      <div class="act-head" style="display:flex; justify-content:space-between; gap:10px; margin-bottom:10px;">
        <div><h4 style="margin-bottom:2px;">${d.id} · ${d.type}</h4><div class="warn-note">${d.client} ↔ ${d.sto} · заказ №${d.order}</div></div>
        ${decideTimer(d)}
      </div>
      <p style="font-size:13.5px; margin-bottom:8px;">«${d.claim}»</p>
      <div class="kv"><span>Предложение диспетчера</span><b>${DECISIONS[d.proposal.decision]} · ${money(d.proposal.amount)}</b></div>
      <div class="kv"><span>Обоснование</span><b style="max-width:60%;">${d.proposal.reason}</b></div>
      ${moneyCalc(d, d.proposal.amount)}
      <div class="btn-row"><button class="btn btn-outline btn-sm" onclick="openDispute('${d.id}')">Открыть спор целиком</button></div>
      ${directorButtons(d)}
    </div>`).join('') : '<div class="empty-state"><p>Нет возвратов на утверждение</p></div>'}`;
}
function approve(id){
  const d = disputes.find(x=>x.id===id);
  const c = (document.getElementById('dirComment-'+id)||{}).value||'';
  d.status='closed';
  d.result = `${DECISIONS[d.proposal.decision]} ${money(d.proposal.amount)} утверждён директором. Удержан из выплаты СТО «${d.sto}». ${d.proposal.reason}${c?' Комментарий директора: '+c:''}`;
  d.log.push({t:nowStr(), x:`Директор утвердил возврат ${money(d.proposal.amount)}. Оплата разблокирована`});
  const o = orders.find(x=>x.id===d.order); if(o) o.frozen=false;
  showToast(`Возврат ${money(d.proposal.amount)} утверждён — клиентка и СТО получили push`);
  render();
}
function reject(id){
  const d = disputes.find(x=>x.id===id);
  const c = ((document.getElementById('dirComment-'+id)||{}).value||'').trim();
  if(!c){ showToast('Напишите, что нужно доработать'); return; }
  d.status='open'; d.log.push({t:nowStr(), x:`Директор вернул на доработку: ${c}`}); delete d.proposal;
  showToast('Спор возвращён диспетчеру');
  render();
}

/* ---------------- КОНСЬЕРЖИ ---------------- */
const C_STATUS = {free:'свободен', road:'в пути', job:'на заказе', off:'не на смене', late:'опаздывает'};
let fineEdit = null;
function renderConcierges(){
  const free = concierges.filter(c=>c.status==='free').sort((a,b)=>a.dist-b.dist);
  document.getElementById('view-concierges').innerHTML = `
    <div class="topbar"><div><h1>Консьержи</h1><p class="sub">Назначение на заказы и контроль опозданий. Опоздание больше 20 минут — штраф 50% от стоимости выезда (${money(CONCIERGE_FEE)})</p></div></div>
    ${unassigned.map(u=>`<div class="panel" style="border-color:var(--amber);">
      <h4>Ждёт назначения · заказ №${u.id}</h4>
      <div class="kv"><span>${u.car} · ${u.client}</span><b>${u.address} · ${u.slot}</b></div>
      <p class="warn-note" style="margin:10px 0 8px;">Ближайшие свободные к адресу забора:</p>
      ${free.map(c=>`<div class="kv" style="align-items:center;"><span><b style="color:var(--ink);">${c.name}</b> · ${c.car} · ★ ${c.rating} · ${c.dist} км</span><button class="btn btn-primary btn-sm" onclick="assign('${u.id}','${c.name}')">Назначить</button></div>`).join('')}
    </div>`).join('')}
    <table class="tbl"><thead><tr><th>Консьерж</th><th>Статус</th><th>Сейчас</th><th>Штрафы</th><th></th></tr></thead><tbody>
    ${concierges.map((c,i)=>{
      const active = c.fines.filter(f=>!f.removed);
      return `<tr class="${c.status==='late'?'hl':''}">
        <td><b>${c.name}</b><div class="sub">${c.car} · ★ ${c.rating}</div></td>
        <td><span class="pill ${c.status}">${C_STATUS[c.status]}${c.status==='late'?' '+c.lateMin+' мин':''}</span></td>
        <td>${c.order?`Заказ №${c.order}<div class="sub">${c.note}</div>`:`<span class="sub">${c.note}</span>`}</td>
        <td class="mono">${active.length?active.map(f=>`${money(f.sum)} · №${f.order}`).join('<br>'):'—'}${c.fines.some(f=>f.removed)?'<div class="sub">есть снятые</div>':''}</td>
        <td style="text-align:right; white-space:nowrap;">
          ${c.status==='late'?`<button class="btn btn-outline btn-sm" onclick="reassign(${i})">Переназначить</button> `:''}
          ${active.length?`<button class="btn btn-outline btn-sm" onclick="fineEdit=${i}; renderConcierges();">Снять штраф</button>`:''}
        </td></tr>
        ${fineEdit===i?`<tr><td colspan="5" style="background:var(--paper);">
          <div style="display:flex; gap:8px; align-items:center;"><select class="inp" id="fineReason" style="max-width:360px;"><option>Пробка из-за ДТП на маршруте</option><option>Задержка по вине клиентки</option><option>Диспетчер изменил маршрут</option><option>Другое</option></select>
          <button class="btn btn-dark btn-sm" onclick="removeFine(${i})">Снять с обоснованием</button><button class="btn btn-outline btn-sm" onclick="fineEdit=null; renderConcierges();">Отмена</button></div></td></tr>`:''}`;
    }).join('')}</tbody></table>`;
}
function assign(orderId, name){
  const c = concierges.find(x=>x.name===name);
  c.status='road'; c.order=orderId; c.note='Едет к клиентке · ул. Железнодорожная, 33'; c.dist=null;
  unassigned = unassigned.filter(u=>u.id!==orderId);
  showToast(`${name} назначен на заказ №${orderId} — клиентке пришёл push с карточкой консьержа`);
  render();
}
function reassign(i){
  const c = concierges[i];
  const free = concierges.filter(x=>x.status==='free').sort((a,b)=>a.dist-b.dist)[0];
  if(!free){ showToast('Нет свободных консьержей'); return; }
  free.status='road'; free.order=c.order; free.note=c.note; free.dist=null;
  c.fines.push({order:c.order, sum:CONCIERGE_FEE*0.5, date:'сегодня', removed:false});
  c.status='free'; c.note='Снят с заказа, штраф за опоздание начислен'; c.order=null; c.lateMin=0; c.dist=2.8;
  const o = orders.find(x=>x.id===free.order); if(o){ o.concierge=free.name; o.stuck=null; o.stage='Консьерж в пути'; o.inStage='только что'; }
  showToast(`Заказ передан: ${free.name}. ${c.name} — штраф ${money(CONCIERGE_FEE*0.5)}`);
  render();
}
function removeFine(i){
  const c = concierges[i];
  const f = c.fines.find(x=>!x.removed); f.removed=true; f.reason=document.getElementById('fineReason').value;
  fineEdit=null;
  showToast(`Штраф ${c.name} снят. Причина: ${f.reason}`);
  render();
}

/* ---------------- ЗАКАЗЫ ---------------- */
function renderOrders(){
  document.getElementById('view-orders').innerHTML = `
    <div class="topbar"><div><h1>Заказы</h1><p class="sub">Шаги консьержа и подсветка зависших заказов</p></div></div>
    <table class="tbl"><thead><tr><th style="width:190px;">Заказ</th><th>Ход заказа</th><th>Сейчас</th><th></th></tr></thead><tbody>
    ${orders.map(o=>`<tr class="${o.stuck?'hl':''}">
      <td class="order-cell"><b>№${o.id}</b> · ${o.car}<div class="sub">${o.client} · ${o.sto}</div><div class="sub">Консьерж: ${o.concierge}</div></td>
      <td class="steps-cell"><div class="steps-track">${ORDER_STEPS.map((s,i)=>`<div class="${i<o.step?'done':i===o.step?'cur':''}" title="${s}"></div>`).join('')}</div>
        <div class="steps-lbl"><span>${ORDER_STEPS[0]}</span><span>${o.step>=8?'Возвращено':ORDER_STEPS[o.step]}</span><span>${ORDER_STEPS[7]}</span></div></td>
      <td class="nw">${o.stage}<div class="sub">в стадии: ${o.inStage}</div>${o.stuck?`<div class="sub" style="color:var(--alert); font-weight:600;">${o.stuck}</div>`:''}${o.frozen?'<div class="sub" style="color:var(--alert);">оплата заморожена</div>':''}</td>
      <td style="text-align:right; white-space:nowrap;">${o.stuck?`<button class="btn btn-outline btn-sm" onclick="nudge('${o.id}')">Написать сторонам</button>`:''}</td>
    </tr>`).join('')}</tbody></table>`;
}
function nudge(id){
  const o = orders.find(x=>x.id===id);
  showToast(`Сообщение отправлено: ${o.client} и ${o.sto}`);
}

/* ---------------- ПЕРЕДАЧА СМЕНЫ ---------------- */
function renderHandover(){
  const items = [
    ...sosCalls.filter(s=>s.step<4).map(s=>({k:s.id, t:`SOS ${s.id} · ${s.scenario} · ${s.client}`, s:SOS_STEPS[s.step]})),
    ...disputes.filter(d=>d.status!=='closed').map(d=>({k:d.id, t:`Спор ${d.id} · ${d.type} · ${d.client}`, s:STATUS_LBL[d.status]})),
    ...orders.filter(o=>o.stuck).map(o=>({k:'o'+o.id, t:`Заказ №${o.id} · ${o.stuck}`, s:o.stage}))
  ];
  document.getElementById('view-handover').innerHTML = `
    <div class="topbar"><div><h1>Передача смены</h1><p class="sub">Дневная смена (Ольга К.) → вечерняя смена 16:00–00:00 (Андрей М.). Всё открытое переходит со статусом и комментарием</p></div></div>
    <div class="panel handover">${items.map(it=>`<div style="padding:10px 0; border-bottom:1px solid var(--line);">
      <div style="display:flex; justify-content:space-between; gap:10px;"><b style="font-size:13.5px;">${it.t}</b><span class="pill waiting">${it.s}</span></div>
      <textarea placeholder="Комментарий для следующей смены" oninput="handoverNotes['${it.k}']=this.value">${handoverNotes[it.k]||''}</textarea>
    </div>`).join('')}
    <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="showToast('Смена передана Андрею М. — ${items.length} открытых пунктов с комментариями')">Передать смену</button></div>`;
}

/* ---------------- ЖИВЫЕ ТАЙМЕРЫ И ДЕМО-СОБЫТИЕ ---------------- */
setInterval(()=>{
  if(['overview','sos','disputes'].includes(currentView)) render();
  else if(currentView==='dispute'){ // обновляем только таймеры, чтобы не сбивать ввод
    const d = disputes.find(x=>x.id===openDisputeId);
    const box = document.querySelector('#view-dispute .topbar > div:last-child');
    if(box) box.innerHTML = `${d.status==='open'&&d.takenAt===null?reactTimer(d):''}${decideTimer(d)}<span class="pill ${d.status}">${STATUS_LBL[d.status]}</span>`;
  }
}, 1000);

/* демо-события (новые SOS, заявки) теперь приходят с сервера экосистемы */
renderShift();
showView('overview');
</script>
