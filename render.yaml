# Render.com Blueprint: Dashboard → New → Blueprint → выбрать этот репозиторий.
# Бесплатный план: сервис засыпает после 15 минут без запросов (первый запрос ~1 мин),
# данные сбрасываются при перезапуске. Для постоянного хранения — план starter + диск (см. ниже).
services:
  - type: web
    name: moy-avtomekhanik
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Деплой запускает GitHub Actions через deploy hook после зелёных тестов (см. README → «Автодеплой»).
    autoDeploy: false
    envVars:
      - key: DB_FILE
        value: /data/ecosystem.db
    # Чтобы данные переживали перезапуски (только платные планы):
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
